[project]
name = "Vsaan212-workflow-utilities"  # Node ID (immutable once published)
version = "1.10.0"
description = "Subject & Scenario Selectors, Lazy Subject + Scene Automation, Lazy Image Loader, Lazy MiniMax all-in-one, Text Split, Optional Switch LoRA, Lazy Prompt Saver, and LazyPrompt (Model_Skills) for ComfyUI."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "vsaan212" }]

# Optional but nice to have:
keywords = ["comfyui", "custom-nodes", "prompt", "lora", "workflow", "textsplit", "prompt select"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/vsaan212/Vsaan212-workflow-utilities"
Repository = "https://github.com/vsaan212/Vsaan212-workflow-utilities"
Issues = "https://github.com/vsaan212/Vsaan212-workflow-utilities/issues"

[tool.comfy]
PublisherId = "evangelist"              # your publisher handle
DisplayName = "vsaan212"              # what users see in the Registry
requires-comfyui = ">= 0.13"          # adjust if you want to target a specific range
